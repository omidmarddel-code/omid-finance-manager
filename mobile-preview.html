<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Mobile Preview</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #111;
      }

      .frame {
        width: min(390px, 88vw);
        aspect-ratio: 390 / 780;
        height: auto;
        max-height: 88vh;
        border: 10px solid #222;
        border-radius: 32px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <iframe src="/"></iframe>
    </div>
  </body>
</html>
